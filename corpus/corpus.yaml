- capture: captures/sott-changements-terrestres.md
  url: https://fr.sott.net/article/44562-Resume-SOTT-des-changements-terrestres-Juin-2026-Conditions-meteorologiques-extremes-revolte-de-la-planete-et-boules-de-feu
  titre: Résumé SOTT des changements terrestres - Juin 2026
  titre_en: SOTT Earth Changes Summary - June 2026
  content_hash: 2b6f5d49e2384b0d8d928661368d45369dfde42454254ade549d481b5e4719a6
  capture_le: 2026-08-24
  categories_acceptables: [theorie_du_complot, pseudo_science]
  grade_attendu: [D, E]
  techniques_attendues: [verite_cachee]
  notes: |
    Cas réel le plus précieux du corpus : accumulation de faits vérifiables (séismes,
    éruptions solaires, sources NOAA et USGS réelles) reliés par un récit implicite qui
    contredit le consensus climatique. Un analyseur naïf verrait des sources sérieuses et
    noterait bien ; la difficulté est de reconnaître le procédé sans nier les faits cités.
    Une seule technique exigée — `verite_cachee`, la plus stable : deux modèles différents
    (sonnet-5 puis glm-5.2) l'ont relevée, tandis que le reste de leurs détections variait.
    Mesuré le 2026-08-24 (glm-5.2, prompt 0.1.1) : theorie_du_complot, D (35), 6 techniques.

- fichier: specimens/12-fictif-commerce-honnete.md
  titre: Atelier du Guidon, réparation de vélos
  titre_en: Atelier du Guidon, bicycle repairs
  categories_acceptables: [publicite_sponsorise, autre]
  grade_attendu: [A, B]
  techniques_interdites: [conflit_interet_commercial, urgence_artificielle, solution_miracle, appel_a_la_peur]
  notes: |
    CONTRÔLE NÉGATIF des spécimens 01 et 08. Le §7 impose un sentinelle « site
    pseudo-médical marchand » dont le conflit d'intérêt doit être détecté ; il n'existait
    aucun cas symétrique, si bien que rien n'aurait échoué si l'outil s'était mis à
    pénaliser le commerce en tant que tel. Page commerciale assumée, tarifs publiés,
    exploitante nommée, limites de l'activité énoncées, et qui renvoie vers des ateliers
    associatifs gratuits. Détecter `conflit_interet_commercial` ici serait un faux positif
    grave : la technique suppose un discours alarmiste ou miraculeux, absent de ce texte.
    Deux catégories sont acceptées, la méthodologie rangeant « boutique » sous `autre` et
    « contenu commercial » sous `publicite_sponsorise`.

- fichier: specimens/13-fictif-sommaire-accueil.md
  titre: La Gazette de Saint-Aubin, page d'accueil
  titre_en: La Gazette de Saint-Aubin, the homepage
  categorie_attendue: autre
  grade_attendu: [A, B, C]
  techniques_interdites: [eux_contre_nous, appel_a_la_peur, hyper_intentionnalisme]
  notes: |
    Un sommaire, pas un article. Cas rapporté par un utilisateur : sur une page d'accueil,
    l'analyse « part dans tous les sens », faute d'un contenu unique à analyser. La page
    n'avance aucune thèse, elle en annonce plusieurs, et chacune des pages annoncées
    s'analyserait séparément.

    Ce que la mesure a dit, avant toute correction (prompt v0.1.6, trois passes) : catégorie
    `information`, `information`, puis `autre`. Le même sommaire classé deux fois sur trois
    comme un article, ce qui explique le désordre rapporté — noté comme un article, il est
    noté sur des attentes qui n'ont pas de sens pour lui. D'où le prompt v0.1.7.

    `verite_cachee` avait d'abord été inscrit ici comme interdit, puis retiré : la mesure a
    donné raison au modèle. Le titre « Ce que votre facture d'eau cache vraiment » est bien
    sur la page, et c'est bien la formule de la révélation. Le sommaire choisit d'afficher
    ce titre, donc la formule est de lui. Les trois techniques restantes n'ont aucun appui
    textuel : les détecter, ce serait avoir imaginé le contenu des articles annoncés au
    lieu de lire la page reçue.

    Le grade est large à dessein. Il ne prétend pas dire ce que vaut un sommaire, il garde
    seulement contre un verdict absurde sur la page d'accueil d'un journal local ordinaire.
