# Vérification à chaque poussée et à chaque proposition : ce que `./verifier.sh` fait en
# local, sur des machines fournies par GitHub.
#
# Ces travaux tournaient jusqu'à l'ouverture publique du dépôt sur un runner auto-hébergé,
# et les propositions venues d'un fork en étaient exclues : un runner auto-hébergé exécute
# le code qu'on lui donne, et l'ouvrir aux forks revenait à offrir la machine. La
# conséquence était fâcheuse pour un projet qui espère des contributions : la proposition
# d'un inconnu ne déclenchait aucune vérification, l'auteur n'avait aucun retour et le
# mainteneur relisait à l'aveugle.
#
# Une machine fournie par GitHub est jetable, et gratuite sans plafond sur un dépôt public.
# Les forks y tournent donc sans réserve, ce qui est le vrai gain de cette bascule.
name: Tests

on:
  push:
    branches: [main, next, dev, "feat/**", "fix/**", "docs/**", "perf/**"]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pytest
        working-directory: api
        run: |
          pip install --quiet --no-cache-dir -e '.[dev]'
          python -m pytest -q

  extension:
    name: Extension (typage, tests, parité de hachage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Le dépôt entier est nécessaire, pas seulement extension/ : identite.test.mjs compare
      # la palette, le logotype et les polices embarquées à ceux du portail, qui vivent sous
      # api/. Et `npm test` inclut le test de parité, qui rejoue les douze URL de référence à
      # travers l'implémentation Python et compare les empreintes : c'est lui qui garantit
      # qu'un lookup lancé par l'extension tombe sur l'entrée écrite par le serveur. Python
      # est présent d'office sur les machines d'Ubuntu, il n'y a rien à installer.
      - name: npm ci, tsc, node --test
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          npm run verifier
          npm test

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La détection de GitHub ne reconnaît pas les secrets propres à ce projet : la clé
      # privée qui signe les accès, les URL de webhook, les noms de machines du tailnet.
      # Cette étape est la même que celle de `verifier.sh`, rejouée ici pour que la
      # proposition d'un contributeur soit couverte aussi.
      - name: chercher-secrets
        run: outils/chercher-secrets.py
