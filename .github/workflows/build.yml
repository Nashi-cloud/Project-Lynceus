# Construction et publication de l'image, sur une machine fournie par GitHub.
#
# Une seule image sert l'instance ET le portail : ce sont deux commandes d'entrée du même
# paquet (voir api/Dockerfile).
#
# Étiquettes :
#   dev  -> :dev
#   next -> :next
#   main -> :latest + :vX.Y.Z (lu dans VERSION)
#
# Le déploiement ne figure plus ici, et c'est délibéré. Il se faisait par webhook Portainer
# depuis un runner auto-hébergé, seul capable de joindre le réseau privé de l'exploitant.
# Une URL de webhook est un jeton de déploiement déguisé, et la faire sortir de ce réseau
# aurait été un recul. Le sens est donc inversé : Portainer va chercher l'image publiée sur
# GHCR, plus rien n'entre. Voir api/DEPLOIEMENT.md.
name: Forge Build - Lynceus

on:
  push:
    branches: [main, next, dev]

# packages: write est ce qui autorise la publication sur GHCR avec le jeton du workflow.
# Aucun compte de registre à créer, aucun secret à faire tourner.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lynceus-api

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'étiquette dépend de la branche, et main en porte deux : « latest » pour ce que les
      # instances suivent, et la version pour pouvoir revenir en arrière. Elle vient du
      # fichier VERSION, dont verifier.sh garantit l'accord avec pyproject.toml et
      # __init__.py : un décalage produirait une instance annonçant sur /v1/meta une version
      # que personne ne saurait redéployer.
      - name: Étiquettes selon la branche
        id: etiquettes
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)  echo "tags=${IMAGE}:dev"  >> "$GITHUB_OUTPUT" ;;
            next) echo "tags=${IMAGE}:next" >> "$GITHUB_OUTPUT" ;;
            main) VERSION=$(tr -d '[:space:]' < VERSION)
                  echo "tags=${IMAGE}:latest,${IMAGE}:v${VERSION}" >> "$GITHUB_OUTPUT" ;;
          esac

      # Le contexte est la racine du dépôt, pas api/ : l'image embarque prompts/, docs/,
      # schema/ et corpus/, et son premier étage construit le paquet de l'extension.
      #
      # Le cache remplace celui du registre local qu'offrait le runner auto-hébergé. Sans
      # lui, chaque construction repartirait d'un npm ci et d'un pip install complets.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        run: |
          echo "Image publiée : ${{ steps.etiquettes.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Les instances la tirent d'elles-mêmes ; rien n'est poussé vers elles." >> "$GITHUB_STEP_SUMMARY"
