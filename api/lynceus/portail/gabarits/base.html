<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}{{ nom }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ nom }} — une extension libre qui explique les procédés de persuasion d'une page web, sans dire à personne ce qu'il doit penser.{% endblock %}">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/statique/lynceus.css">
<script src="/statique/htmx.min.js" defer></script>
{% block tete %}{% endblock %}
</head>
<body{% block classe_corps %}{% endblock %}>

<header class="bandeau">
  <a class="marque" href="/">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M1.6 12S5.4 5.2 12 5.2 22.4 12 22.4 12 18.6 18.8 12 18.8 1.6 12 1.6 12Z"/>
      <circle cx="12" cy="12" r="3.2"/>
    </svg>
    {{ nom }}
  </a>
  <nav>
    <a href="/installer">Installer</a>
    <a href="/methodologie">Méthode</a>
    <a href="/taxonomie">Procédés</a>
    <a href="/annuaire">Annuaire</a>
    <a href="/charte">Charte</a>
    <a href="/auto-hebergement">S'héberger</a>
  </nav>
</header>

<main>{% block corps %}{% endblock %}</main>

<footer class="pied">
  <div class="contenu large">
    <span>{{ nom }} — logiciel libre sous AGPL-3.0. Portail v{{ version }}.</span>
    <a href="/charte">Charte éthique</a>
    <a href="/contester">Contester une analyse</a>
    <a href="/auto-hebergement">Héberger sa propre instance</a>
    {% if contact %}<a href="mailto:{{ contact }}">{{ contact }}</a>{% endif %}
  </div>
</footer>

</body>
</html>
