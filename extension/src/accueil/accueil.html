<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="accueil_titre">Bienvenue dans Lynceus</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../commun/lynceus.css">
  <style>
    body { margin: 0; background: var(--fond); color: var(--encre);
           font: 400 16px/1.7 var(--texte); -webkit-font-smoothing: antialiased; }
    .bandeau { border-bottom: 1px solid var(--trait); background: var(--fond-2);
               padding: 0.85rem clamp(1rem, 5vw, 2rem); }
    main { max-width: 40rem; margin: 0 auto; padding: clamp(2rem, 6vw, 3.2rem) 1.25rem 4rem; }
    .surtitre { font: 650 0.78rem/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase;
                color: var(--laiton); margin: 0 0 0.9rem; }
    h1 { font-size: clamp(1.9rem, 1.4rem + 2vw, 2.6rem); margin: 0 0 0.35em;
         font-variation-settings: "opsz" 72; }
    h2 { font-size: 1.25rem; margin: 0 0 0.3em; font-variation-settings: "opsz" 40; }
    .chapo { font-size: 1.1rem; line-height: 1.6; color: var(--encre-2); margin: 0 0 2.4rem;
             text-wrap: pretty; }
    p { margin: 0 0 1em; }
    .carte { margin-bottom: 1.1rem; }
    .carte ul { margin: 0.8rem 0 0; padding-left: 1.2em; }
    .carte li { margin: 0.35em 0; color: var(--encre-2); font-size: 0.94rem; }
    .actions { margin-top: 1.1rem; }
    label { display: block; font: 600 0.84rem/1.5 var(--ui); color: var(--encre-2);
            margin: 1.1rem 0 0.3rem; }
    .encart { margin: 2rem 0; font-size: 0.95rem; }
    .encart strong { color: var(--encre); }
    #etat, #etat-inscription { margin-top: 0.9rem; font: 600 0.92rem/1.5 var(--ui); }
    #etat.ok, #etat-inscription.ok { color: var(--a); }
    .pied { margin-top: 2.6rem; border-top: 1px solid var(--trait); padding-top: 1rem;
            color: var(--encre-2); font-size: 0.88rem; }
    .pied p { margin: 0.3em 0; }
  </style>
</head>
<body>

<header class="bandeau">
  <span class="marque"><!--LOGO-->Lynceus</span>
</header>

<main>
  <p class="surtitre" data-i18n="accueil_surtitre">Installation</p>
  <h1 data-i18n="accueil_titre">Bienvenue dans Lynceus</h1>
  <p class="chapo" data-i18n="accueil_chapo">…</p>

  <div class="carte retenue" id="carte-inscription">
    <h2 data-i18n="accueil_inscription_titre">…</h2>
    <p class="aide" data-i18n-html="accueil_inscription_aide">…</p>
    <label for="portail" data-i18n="accueil_portail_label">Adresse du portail</label>
    <input type="url" id="portail" class="champ" placeholder="https://…" autocomplete="off">
    <div class="actions">
      <button class="bouton" id="obtenir-cle" data-i18n="accueil_obtenir_cle">…</button>
      <button class="bouton creux" id="deja-instance" data-i18n="accueil_deja_instance">…</button>
    </div>
    <div id="etat-inscription" role="status"></div>
    <ul>
      <li data-i18n-html="accueil_cle_contenu">…</li>
      <li data-i18n="accueil_cle_auto_heberge">…</li>
    </ul>
  </div>

  <div class="carte retenue">
    <h2 data-i18n="accueil_reconnaissance_titre">…</h2>
    <p class="aide" data-i18n="accueil_reconnaissance_aide">…</p>
    <ul>
      <li data-i18n-html="accueil_reconnaissance_1">…</li>
      <li data-i18n-html="accueil_reconnaissance_2">…</li>
      <li data-i18n-html="accueil_reconnaissance_3">…</li>
      <li data-i18n="accueil_reconnaissance_4">…</li>
    </ul>
    <div class="actions">
      <button class="bouton" id="activer" data-i18n="accueil_activer">…</button>
      <button class="bouton creux" id="plus-tard" data-i18n="accueil_plus_tard_bouton">…</button>
    </div>
    <div id="etat" role="status"></div>
  </div>

  <div class="encart">
    <p data-i18n-html="accueil_ce_qui_est_envoye">…</p>
  </div>

  <div class="carte">
    <h2 data-i18n="accueil_sans_activer_titre">…</h2>
    <p class="aide" data-i18n="accueil_sans_activer_aide">…</p>
  </div>

  <div class="pied">
    <p><span data-i18n="accueil_pied">…</span>
      <a href="#" id="lien-reglages" data-i18n="reglages">réglages</a>.</p>
    <p id="version"></p>
  </div>
</main>

<script src="accueil.js"></script>
</body>
</html>
