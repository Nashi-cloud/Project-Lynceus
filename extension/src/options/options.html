<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="options_titre_page">Réglages de Lynceus</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../commun/lynceus.css">
  <style>
    body { margin: 0; background: var(--fond); color: var(--encre);
           font: 400 16px/1.7 var(--texte); -webkit-font-smoothing: antialiased; }
    .bandeau { border-bottom: 1px solid var(--trait); background: var(--fond-2);
               padding: 0.85rem clamp(1rem, 5vw, 2rem); }
    main { max-width: 40rem; margin: 0 auto; padding: clamp(2rem, 6vw, 3rem) 1.25rem 4rem; }
    .surtitre { font: 650 0.78rem/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase;
                color: var(--laiton); margin: 0 0 0.9rem; }
    h1 { font-size: clamp(1.7rem, 1.3rem + 1.6vw, 2.2rem); margin: 0 0 1.6rem;
         font-variation-settings: "opsz" 72; }
    h2 { font-size: 1.15rem; margin: 2.2rem 0 0.4rem; font-variation-settings: "opsz" 40; }
    p { margin: 0 0 0.9em; }
    .champ + .actions { margin-top: 0.8rem; }
    .interrupteur { display: flex; gap: 0.7rem; align-items: flex-start; margin-top: 0.7rem;
                    font: inherit; color: inherit; }
    .interrupteur input { margin-top: 0.45rem; accent-color: var(--laiton); flex: none; }
    .interrupteur > span { font-size: 0.95rem; }
    #instance-infos { margin-top: 0.9rem; padding: 0.8rem 1rem; background: var(--carte);
                      border: 1px solid var(--trait); border-radius: 12px;
                      font: 400 0.88rem/1.6 var(--ui); white-space: pre-line; }
    #etat, #etat-inscription { margin-top: 0.9rem; font: 600 0.92rem/1.5 var(--ui); }
    #etat.ok, #etat-inscription.ok { color: var(--a); }
    #delai { width: 7rem; display: inline-block; }
    .unite { font-size: 0.9rem; color: var(--encre-2); }
    .cache { display: none; }
    .pied { margin-top: 2.4rem; border-top: 1px solid var(--trait); padding-top: 1rem; }
  </style>
</head>
<body>

<header class="bandeau">
  <span class="marque"><!--LOGO-->Lynceus</span>
</header>

<main>
  <p class="surtitre" data-i18n="options_surtitre">Configuration</p>
  <h1 data-i18n="options_titre">Réglages</h1>

  <h2 data-i18n="options_instance">Instance Lynceus</h2>
  <p class="aide" data-i18n="options_instance_aide">L'adresse du serveur qui analyse et tient l'annuaire.</p>
  <input type="url" id="instance" class="champ" placeholder="http://localhost:8000">
  <div class="actions">
    <button class="bouton creux" id="tester" data-i18n="options_tester">Tester la connexion</button>
  </div>
  <div id="instance-infos" class="cache"></div>

  <h2 data-i18n="options_badge">Badge et contour passifs</h2>
  <label class="interrupteur">
    <input type="checkbox" id="badge">
    <span><span data-i18n="options_badge_intitule">Afficher la note sur l'icône…</span><br>
      <span class="aide" data-i18n-html="options_badge_aide">…</span></span>
  </label>

  <h2 data-i18n="options_cle">Clé d'accès</h2>
  <p class="aide" data-i18n-html="options_cle_aide">…</p>
  <input type="text" id="cle" class="champ" data-i18n-attr="placeholder:options_cle_invite" autocomplete="off">

  <p class="aide" style="margin-top:1rem;" data-i18n-html="options_portail_aide">…</p>
  <input type="url" id="portail" class="champ" data-i18n-attr="placeholder:options_portail_invite"
         autocomplete="off">
  <div class="actions">
    <button class="bouton creux" id="obtenir-cle" data-i18n="options_obtenir_cle">Obtenir une clé</button>
  </div>
  <div id="etat-inscription" class="cache"></div>

  <h2 data-i18n="options_delai">Filet de sécurité réseau</h2>
  <p class="aide" data-i18n="options_delai_aide">…</p>
  <input type="number" id="delai" class="champ" min="30" max="1800" step="10">
  <span class="unite" data-i18n="secondes">secondes</span>

  <div class="actions" style="margin-top:1.4rem;">
    <button class="bouton" id="enregistrer" data-i18n="enregistrer">Enregistrer</button>
  </div>
  <div id="etat" role="status"></div>

  <p class="aide pied" id="version"></p>
</main>

<script src="options.js"></script>
</body>
</html>
